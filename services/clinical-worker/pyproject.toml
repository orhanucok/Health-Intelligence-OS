[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbalyst-clinical-worker"
version = "0.1.0"
description = "Local deterministic synthetic fixture extraction worker"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "black>=24,<25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
