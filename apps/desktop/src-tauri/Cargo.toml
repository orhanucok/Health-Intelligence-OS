[package]
name = "health-council-desktop"
version = "0.1.0"
description = "Local-first synthetic clinical record review shell"
edition = "2024"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
clinical-core = { path = "../../../crates/clinical-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
